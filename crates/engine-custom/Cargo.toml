[package]
name = "fluxaxiom-engine-custom"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
async-trait = "0.1"
bytes = "1.12.1"
fluxaxiom-contract = { path = "../agent-contract" }
fluxaxiom-engine-api = { path = "../engine-api" }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
grep-regex = "0.1"
grep-searcher = "0.1"
ignore = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
tokio-util = "0.7"

[dev-dependencies]
tempfile = "3.27.0"
