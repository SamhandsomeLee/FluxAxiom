[package]
name = "fluxaxiom-cli"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "flux"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
dotenvy = "0.15"
fluxaxiom-contract = { path = "../../crates/agent-contract" }
fluxaxiom-engine-api = { path = "../../crates/engine-api" }
fluxaxiom-engine-custom = { path = "../../crates/engine-custom" }
fluxaxiom-run-host = { path = "../../crates/run-host" }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
serde_json = "1"
tempfile = "3"
