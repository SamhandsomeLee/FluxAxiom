name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
          build-warnings: ""
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Verify symlink security boundaries (capability required)
        shell: pwsh
        run: |
          cargo test -p fluxaxiom-engine-custom --test tools -- --ignored
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test -p fluxaxiom-run-host --test drive -- --ignored
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
